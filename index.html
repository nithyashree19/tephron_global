    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <style>
      /* static summary for crawlers and no-JS visitors; React replaces it on mount */
      .js #prerender { display: none; }
    </style>

    <!-- Inter is the fallback for SF Pro on non-Apple devices. It has an optical-size axis. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-mount theme script: prevents a flash of the wrong theme -->
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
